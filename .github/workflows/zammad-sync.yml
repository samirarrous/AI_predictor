name: Sync GitHub Issues with Zammad

on:
  issues:
    types: [opened]

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Create Zammad ticket from GitHub issue
        shell: powershell
        env:
          ZAMMAD_URL: ${{ secrets.ZAMMAD_URL }}
          ZAMMAD_TOKEN: ${{ secrets.ZAMMAD_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ($env:ISSUE_TITLE -match '^Ticket Zammad #(\d+)') {
            $ticketNumber = $Matches[1]
            Write-Host "Issue from Zammad (ticket #$ticketNumber). Linking issue to ticket..."

            try {
              $headers = @{
                Authorization = "Bearer $env:ZAMMAD_TOKEN"
              }

              # --- DEBUG TEMP : Query links for ticket ID 30 ---
              Write-Host "=== DEBUG: Fetching links for ticket ID 30 using HttpClient ==="
              try {
                Add-Type -AssemblyName System.Net.Http
                $client = New-Object System.Net.Http.HttpClient
                $client.DefaultRequestHeaders.TryAddWithoutValidation("Authorization", "Bearer $env:ZAMMAD_TOKEN")
                
                $request = New-Object System.Net.Http.HttpRequestMessage
                $request.Method = [System.Net.Http.HttpMethod]::Get
                $request.RequestUri = New-Object Uri("$env:ZAMMAD_URL/api/v1/links")
                
                $body = @{
                  link_object = "Ticket"
                  link_object_value = "30"
                } | ConvertTo-Json -Depth 5
                
                $request.Content = New-Object System.Net.Http.StringContent($body, [System.Text.Encoding]::UTF8, "application/json")
                
                $response = $client.SendAsync($request).Result
                $responseBody = $response.Content.ReadAsStringAsync().Result
                
                Write-Host "HttpClient Status: $($response.StatusCode)"
                Write-Host "HttpClient Response JSON: $responseBody"
              } catch {
                Write-Host "Failed to fetch debug links with HttpClient: $_"
              }
              Write-Host "=== END DEBUG ==="

              $ticketId = $null
              $page     = 1
              $perPage  = 50
              $maxPages = 20

              Write-Host "Searching for Zammad ticket number $ticketNumber ..."

              while (-not $ticketId -and $page -le $maxPages) {
                $listUri = "$env:ZAMMAD_URL/api/v1/tickets?page=$page&per_page=$perPage&sort_by=created_at&order_by=desc"
                Write-Host "Fetching page $page : $listUri"

                $tickets = Invoke-RestMethod -Uri $listUri -Method GET -Headers $headers

                if (-not $tickets -or $tickets.Count -eq 0) {
                  Write-Host "No tickets on this page. Stopping search."
                  break
                }

                Write-Host "Received $($tickets.Count) ticket(s) on page $page"

                foreach ($t in $tickets) {
                  Write-Host "Checking ticket id=$($t.id) number=$($t.number)"
                  if ([string]$t.number -eq [string]$ticketNumber) {
                    $ticketId = $t.id
                    Write-Host "FOUND! Internal ID = $ticketId"
                    break
                  }
                }

                if ($ticketId) { break }

                if ($tickets.Count -lt $perPage) {
                  Write-Host "Last page reached. Stopping."
                  break
                }

                $page++
              }

              if ($ticketId) {
                Write-Host "Adding link note to ticket ID $ticketId ..."

                $articleBody = @{
                  ticket_id = [int]$ticketId
                  subject   = "GitHub Issue Link"
                  body      = "GitHub issue created: $env:ISSUE_URL"
                  type      = "note"
                  internal  = $false
                }

                Write-Host "Payload: $(($articleBody | ConvertTo-Json -Depth 5))"

                $articleResult = Invoke-RestMethod `
                  -Uri "$env:ZAMMAD_URL/api/v1/ticket_articles" `
                  -Method POST `
                  -Headers $headers `
                  -ContentType "application/json" `
                  -Body ($articleBody | ConvertTo-Json -Depth 5) `
                  -ErrorAction Stop

                Write-Host "Note created: $($articleResult | ConvertTo-Json -Depth 3)"
              } else {
                Write-Warning "Ticket #$ticketNumber not found after $($page * $perPage) tickets checked."
              }

            } catch {
              Write-Host "=== EXCEPTION ==="
              Write-Host "Message  : $($_.Exception.Message)"
              Write-Host "Type     : $($_.Exception.GetType().FullName)"
              if ($_.Exception.Response -ne $null) {
                try {
                  $stream  = $_.Exception.Response.GetResponseStream()
                  $errBody = (New-Object System.IO.StreamReader($stream)).ReadToEnd()
                  Write-Host "Zammad API error body: $errBody"
                } catch {}
              }
              Write-Error "Error linking ticket: $_"
            }

            exit 0
          }

          Write-Host "Creating Zammad ticket from GitHub issue..."

          $json = @{
              title       = "[GitHub #$env:ISSUE_NUMBER] $env:ISSUE_TITLE"
              group       = "Users"
              customer_id = "guess:git@github.com"
              article     = @{
                  subject  = $env:ISSUE_TITLE
                  body     = "$env:ISSUE_BODY`n`nGitHub link: $env:ISSUE_URL"
                  type     = "note"
                  internal = $false
              }
          } | ConvertTo-Json -Depth 5

          $response = Invoke-WebRequest `
              -Uri "$env:ZAMMAD_URL/api/v1/tickets" `
              -Method POST `
              -Headers @{ Authorization = "Bearer $env:ZAMMAD_TOKEN" } `
              -ContentType "application/json" `
              -Body $json

          Write-Host "HTTP status: $($response.StatusCode)"
          Write-Host "Response: $($response.Content)"