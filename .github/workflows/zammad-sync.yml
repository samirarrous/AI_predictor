name: Sync GitHub Issues with Zammad

on:
  issues:
    types: [opened]

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Create Zammad ticket from GitHub issue
        shell: powershell
        env:
          ZAMMAD_URL: ${{ secrets.ZAMMAD_URL }}
          ZAMMAD_TOKEN: ${{ secrets.ZAMMAD_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ($env:ISSUE_TITLE -match '^Ticket Zammad #(\d+)') {
            $ticketNumber = $Matches[1]
            Write-Host "Cette issue provient de Zammad (ticket #$ticketNumber). Liaison de l'issue au ticket..."

            try {
              $headers = @{
                Authorization  = "Bearer $env:ZAMMAD_TOKEN"
                "Content-Type" = "application/json"
              }
              
              # --- Stratégie fiable : parcourir les tickets via l'API REST standard (sans Elasticsearch) ---
              $ticketId  = $null
              $page      = 1
              $perPage   = 50
              $maxPages  = 20   # limite de sécurité : 50 × 20 = 1000 tickets maximum parcourus

              Write-Host "Recherche du ticket Zammad numéro '$ticketNumber' dans la liste des tickets..."

              while (-not $ticketId -and $page -le $maxPages) {
                $listUri  = "$env:ZAMMAD_URL/api/v1/tickets?page=$page&per_page=$perPage&sort_by=created_at&order_by=desc"
                Write-Host "  → Récupération page $page : $listUri"
                
                $tickets = Invoke-RestMethod -Uri $listUri -Method GET -Headers $headers
                
                if (-not $tickets -or $tickets.Count -eq 0) {
                  Write-Host "  → Aucun ticket sur cette page, arrêt de la recherche."
                  break
                }
                
                Write-Host "  → $($tickets.Count) ticket(s) reçu(s) sur cette page."
                
                foreach ($t in $tickets) {
                  Write-Host "    Vérification ticket id=$($t.id) number='$($t.number)'"
                  if ($t.number -eq $ticketNumber) {
                    $ticketId = $t.id
                    Write-Host "  ✓ Ticket trouvé ! ID interne = $ticketId"
                    break
                  }
                }
                
                if ($tickets.Count -lt $perPage) {
                  Write-Host "  → Dernière page atteinte, arrêt."
                  break
                }
                
                $page++
              }

              if ($ticketId) {
                Write-Host "Ajout de la note de liaison sur le ticket ID $ticketId..."
                
                $articleJson = @{
                  ticket_id = $ticketId
                  subject   = "Lien GitHub"
                  body      = "Issue GitHub associée : $env:ISSUE_URL"
                  type      = "note"
                  internal  = $false
                } | ConvertTo-Json -Depth 5
                
                $articleResponse = Invoke-WebRequest `
                  -Uri "$env:ZAMMAD_URL/api/v1/ticket_articles" `
                  -Method POST `
                  -Headers $headers `
                  -Body $articleJson
                
                Write-Host "Code HTTP (note) : $($articleResponse.StatusCode)"
                Write-Host "Réponse : $($articleResponse.Content)"
              } else {
                Write-Warning "Ticket Zammad #$ticketNumber introuvable dans les $($($page-1) * $perPage) tickets consultés."
              }

            } catch {
              Write-Error "Erreur lors de la liaison du ticket : $_"
              if ($_.Exception.Response) {
                $stream = $_.Exception.Response.GetResponseStream()
                $body   = (New-Object System.IO.StreamReader($stream)).ReadToEnd()
                Write-Host "Réponse d'erreur de l'API Zammad : $body"
              }
            }
            exit 0
          }



          Write-Host "Création du ticket Zammad..."

          $json = @{
              title = "[GitHub #$env:ISSUE_NUMBER] $env:ISSUE_TITLE"
              group = "Users"
              customer_id = "guess:git@github.com"
              article = @{
                  subject = $env:ISSUE_TITLE
                  body = "$env:ISSUE_BODY`n`nLien GitHub : $env:ISSUE_URL"
                  type = "note"
                  internal = $false
              }
          } | ConvertTo-Json -Depth 5

          $response = Invoke-WebRequest `
              -Uri "$env:ZAMMAD_URL/api/v1/tickets" `
              -Method POST `
              -Headers @{
                  Authorization = "Bearer $env:ZAMMAD_TOKEN"
              } `
              -ContentType "application/json" `
              -Body $json

          Write-Host "Code HTTP : $($response.StatusCode)"
          Write-Host "Réponse : $($response.Content)"