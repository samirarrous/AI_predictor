name: Sync GitHub Issues with Zammad

on:
  issues:
    types: [opened]

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Create Zammad ticket from GitHub issue
        shell: powershell
        env:
          ZAMMAD_URL: ${{ secrets.ZAMMAD_URL }}
          ZAMMAD_TOKEN: ${{ secrets.ZAMMAD_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ($env:ISSUE_TITLE -match '^Ticket Zammad #(\d+)') {
            $ticketNumber = $Matches[1]
            Write-Host "Cette issue provient de Zammad (ticket #$ticketNumber). Liaison de l'issue au ticket..."

            try {
              $headers = @{
                Authorization = "Bearer $env:ZAMMAD_TOKEN"
              }
              
              $ticketId = $null
              $maxRetries = 5
              $retryCount = 0
              
              while ($retryCount -lt $maxRetries -and -not $ticketId) {
                if ($retryCount -gt 0) {
                  Write-Host "Ticket non trouvé dans l'index. Attente de 3 secondes avant réessai ($retryCount/$maxRetries)..."
                  Start-Sleep -Seconds 3
                }
                
                # Essai 1 : Recherche avec l'attribut number
                $queryEncoded = [uri]::EscapeDataString("number:$ticketNumber")
                $searchUri = "$env:ZAMMAD_URL/api/v1/tickets/search?query=$queryEncoded"
                Write-Host "Recherche par numéro via : $searchUri"
                try {
                  $searchResponse = Invoke-RestMethod -Uri $searchUri -Method GET -Headers $headers -ContentType "application/json"
                  if ($searchResponse -and $searchResponse.record_ids -and $searchResponse.record_ids.Count -gt 0) {
                    $ticketId = $searchResponse.record_ids[0]
                    Write-Host "Ticket ID trouvé par numéro : $ticketId"
                    break
                  }
                } catch {
                  Write-Host "Recherche par numéro a échoué ou a renvoyé une erreur: $_"
                }
                
                # Essai 2 : Recherche plein texte (au cas où l'indexation par numéro diffère)
                $queryTextEncoded = [uri]::EscapeDataString($ticketNumber)
                $searchUriText = "$env:ZAMMAD_URL/api/v1/tickets/search?query=$queryTextEncoded"
                Write-Host "Recherche plein texte via : $searchUriText"
                try {
                  $searchResponseText = Invoke-RestMethod -Uri $searchUriText -Method GET -Headers $headers -ContentType "application/json"
                  if ($searchResponseText -and $searchResponseText.record_ids -and $searchResponseText.record_ids.Count -gt 0) {
                    $ticketId = $searchResponseText.record_ids[0]
                    Write-Host "Ticket ID trouvé par recherche plein texte : $ticketId"
                    break
                  }
                } catch {
                  Write-Host "Recherche plein texte a échoué: $_"
                }
                
                # Essai 3 : Vérification si le numéro de ticket est l'ID directement
                try {
                  $directUri = "$env:ZAMMAD_URL/api/v1/tickets/$ticketNumber"
                  Write-Host "Tentative de récupération directe par ID via : $directUri"
                  $directResponse = Invoke-RestMethod -Uri $directUri -Method GET -Headers $headers -ContentType "application/json"
                  if ($directResponse -and $directResponse.id) {
                    $ticketId = $directResponse.id
                    Write-Host "Ticket ID trouvé par récupération directe : $ticketId"
                    break
                  }
                } catch {
                  Write-Host "Récupération directe par ID a échoué (normal si le numéro n'est pas l'ID): $_"
                }

                $retryCount++
              }

              if ($ticketId) {
                Write-Host "Ticket ID final retenu : $ticketId. Ajout de la note de liaison..."
                
                $articleJson = @{
                  ticket_id = $ticketId
                  subject = "Lien GitHub"
                  body = "Lien de l'issue GitHub créée : $env:ISSUE_URL"
                  type = "note"
                  internal = $false
                } | ConvertTo-Json -Depth 5
                
                $articleResponse = Invoke-WebRequest `
                  -Uri "$env:ZAMMAD_URL/api/v1/ticket_articles" `
                  -Method POST `
                  -Headers $headers `
                  -ContentType "application/json" `
                  -Body $articleJson
                
                Write-Host "Code HTTP (note) : $($articleResponse.StatusCode)"
                Write-Host "Réponse de la création de note : $($articleResponse.Content)"
              } else {
                Write-Warning "Aucun ticket trouvé dans Zammad pour le numéro #$ticketNumber après toutes les tentatives."
              }
            } catch {
              Write-Error "Erreur lors de la liaison du ticket : $_"
              if ($_.Exception -and $_.Exception.Response) {
                try {
                  $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
                  $responseBody = $reader.ReadToEnd()
                  Write-Host "Corps de la réponse d'erreur de l'API : $responseBody"
                } catch {}
              }
            }
            exit 0
          }


          Write-Host "Création du ticket Zammad..."

          $json = @{
              title = "[GitHub #$env:ISSUE_NUMBER] $env:ISSUE_TITLE"
              group = "Users"
              customer_id = "guess:git@github.com"
              article = @{
                  subject = $env:ISSUE_TITLE
                  body = "$env:ISSUE_BODY`n`nLien GitHub : $env:ISSUE_URL"
                  type = "note"
                  internal = $false
              }
          } | ConvertTo-Json -Depth 5

          $response = Invoke-WebRequest `
              -Uri "$env:ZAMMAD_URL/api/v1/tickets" `
              -Method POST `
              -Headers @{
                  Authorization = "Bearer $env:ZAMMAD_TOKEN"
              } `
              -ContentType "application/json" `
              -Body $json

          Write-Host "Code HTTP : $($response.StatusCode)"
          Write-Host "Réponse : $($response.Content)"